[project]
name = "douyin-feature-extraction"
version = "1.0.0"
description = "Douyin video content feature extraction pipeline"
requires-python = ">=3.10"

dependencies = [
    "torch>=2.4.0,<2.7.0",
    "torchvision>=0.21.0,<0.22.0",
    "transformers>=4.46.0,<4.55.0",
    "sentence-transformers>=3.0.0",
    "librosa>=0.10.0",
    "soundfile>=0.12.0",
    "opencv-python>=4.10.0",
    "ffmpeg-python>=0.2.0",
    "jieba>=0.42.0",
    "Pillow>=10.0.0",
    "httpx>=0.27.0",
    # VLM 视觉画面描述 (Qwen2-VL-2B)
    "qwen-vl-utils>=0.0.8",
    # ASR 语音转文字 (whisper-large-v3)
    "openai-whisper>=20240930",
    # LoRA 微调 (可选, 仅微调时需要)
    "peft>=0.14.0",
    "accelerate>=1.0.0,<2.0.0",
    "bitsandbytes>=0.44.0,<0.46.0",
    # 训练数据导出
    "pymysql>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.uv]
# RTX 4060 8GB + i9-14900

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }
