# ============================================================
# 所有敏感凭据均从环境变量读取，部署前请设置以下变量：
#
#   DB_URL, DB_USERNAME, DB_PASSWORD          — 数据库连接
#   SMTP_HOST, SMTP_PORT, SMTP_USERNAME, SMTP_PASSWORD — 邮件服务
#   JWT_SECRET                                — JWT 签名密钥 (base64)
#   DEEPSEEK_API_KEY                          — DeepSeek AI API key
#   MINIO_ENDPOINT, MINIO_ACCESS_KEY, MINIO_SECRET_KEY — MinIO 对象存储
#   KAFKA_BOOTSTRAP_SERVERS                   — Kafka 地址
# ============================================================

server:
  port: 8080

websocket:
  allowed-origins: ${WEBSOCKET_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
  cluster:
    enabled: ${WEBSOCKET_CLUSTER_ENABLED:false}
    node-id: ${RTC_NODE_ID:local-api}
    channel: ${WEBSOCKET_CLUSTER_CHANNEL:douyin:websocket:fanout:v1}

douyin:
  kafka:
    enabled: ${DOUYIN_KAFKA_ENABLED:false}
    reliability:
      ledger-retention-hours: ${KAFKA_LEDGER_RETENTION_HOURS:744}
      outbox-retention-hours: ${KAFKA_OUTBOX_RETENTION_HOURS:744}
      purge-interval-ms: ${KAFKA_RELIABILITY_PURGE_INTERVAL_MS:3600000}

live:
  engine:
    enabled: ${LIVE_ENGINE_ENABLED:false}
  media:
    srs-rtc-base: ${SRS_RTC_PUBLIC_BASE:}
    srs-http-base: ${SRS_HTTP_PUBLIC_BASE:}
    rtmp-base: ${SRS_RTMP_PUBLIC_BASE:rtmp://localhost:1935/live/}
    reconciliation:
      enabled: ${LIVE_MEDIA_RECONCILIATION_ENABLED:false}
      srs-api-base: ${SRS_API_BASE:http://localhost:1985}
      initial-delay-ms: ${LIVE_MEDIA_RECONCILIATION_INITIAL_DELAY_MS:10000}
      interval-ms: ${LIVE_MEDIA_RECONCILIATION_INTERVAL_MS:15000}
      grace-seconds: ${LIVE_MEDIA_RECONCILIATION_GRACE_SECONDS:45}
      # Bound provider API calls so one hung SRS cannot block reconciliation.
      connect-timeout-ms: ${LIVE_MEDIA_RECONCILIATION_CONNECT_TIMEOUT_MS:2000}
      read-timeout-ms: ${LIVE_MEDIA_RECONCILIATION_READ_TIMEOUT_MS:5000}
    auth:
      # Enable in production together with a random secret of at least 32 chars.
      enabled: ${LIVE_MEDIA_AUTH_ENABLED:false}
      token-secret: ${LIVE_MEDIA_TOKEN_SECRET:}
      token-ttl-seconds: ${LIVE_MEDIA_TOKEN_TTL_SECONDS:300}
      srs-callback-token: ${SRS_CALLBACK_TOKEN:}

spring:
  application:
    name: douyin-server
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB
  jackson:
    property-naming-strategy: SNAKE_CASE
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/douyin?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:5000}
      validation-timeout: ${DB_VALIDATION_TIMEOUT_MS:2000}
      maximum-pool-size: ${DB_MAX_POOL_SIZE:30}
      minimum-idle: ${DB_MIN_IDLE:4}
      pool-name: DouyinHikari
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:douyin-server}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      enable-auto-commit: false
      properties:
        spring.json.trusted.packages: com.douyin.kafka.dto
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: ${REDIS_POOL_MAX_ACTIVE:32}
          max-idle: ${REDIS_POOL_MAX_IDLE:16}
          min-idle: ${REDIS_POOL_MIN_IDLE:4}
          max-wait: 2000ms
  mail:
    host: ${SMTP_HOST:smtp.qq.com}
    port: ${SMTP_PORT:465}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.ssl.enable: true
      mail.smtp.starttls.enable: true

# MyBatis-Plus
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: is_delete
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT
jwt:
  secret: ${JWT_SECRET:}
  expiration: 604800000  # 7 days

# DeepSeek AI
deepseek:
  api-key: ${DEEPSEEK_API_KEY:}
  base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}

# MinIO
minio:
  enabled: ${MINIO_ENABLED:false}
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:}
  secret-key: ${MINIO_SECRET_KEY:}
  bucket-video: ${MINIO_BUCKET_VIDEO:douyin-video}
  bucket-image: ${MINIO_BUCKET_IMAGE:douyin-image}

# RTC 容量门禁与 QoE（RTC-011）。默认关闭；开启后只影响新房/首次媒体 token，
# 已有房间不动。硬门禁 0.8 / 告警 0.7，快照超时与容量服务不可用时 fail-closed。
rtc:
  call:
    ringing-ttl: ${RTC_CALL_RINGING_TTL:180s}
    negotiating-ttl: ${RTC_CALL_NEGOTIATING_TTL:5m}
    history-retention: ${RTC_CALL_HISTORY_RETENTION:31d}
  capacity:
    admission-enabled: ${RTC_CAPACITY_ADMISSION_ENABLED:false}
    snapshot-stale-after-ms: ${RTC_CAPACITY_SNAPSHOT_STALE_MS:15000}
    reservation-ttl-ms: ${RTC_CAPACITY_RESERVATION_TTL_MS:60000}
    warn-threshold: ${RTC_CAPACITY_WARN_THRESHOLD:0.7}
    hard-threshold: ${RTC_CAPACITY_HARD_THRESHOLD:0.8}
    redis-reservation-enabled: ${RTC_CAPACITY_REDIS_RESERVATION:false}
    # 节点容量登记（部署时按实际节点填写；无真实集群时仅作模板）
    nodes:
      - node-id: ${RTC_NODE_ID:local}
        region: default
        zone: default
        advertised-ip: ""
        version: ""
        limits:
          rooms: 1000
          publishers: 2000
          subscribers: 8000
          subscribed_tracks: 16000
          connections: 10000
          egress_mbps: 1000
          rtp_pps: 100000
          cpu_percent: 80
          memory_percent: 85
          turn_relay_mbps: 500
  qoe:
    retention: ${RTC_QOE_RETENTION:15m}
