# One stateless Spring API replica. MySQL, Redis and Kafka are external services.
services:
  api:
    image: ${API_IMAGE:-douyin-server:multi-vm}
    build:
      context: ../../..
      dockerfile: server/Dockerfile
    restart: unless-stopped
    init: true
    mem_limit: ${API_MEMORY_LIMIT:-900m}
    cpus: ${API_CPU_LIMIT:-1.5}
    ports:
      - "${API_BIND_ADDRESS:-0.0.0.0}:${API_HOST_PORT:-9191}:${API_CONTAINER_PORT:-9191}/tcp"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--Duser.timezone=Asia/Shanghai -Xms256m -Xmx768m -XX:+UseG1GC}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SERVER_PORT: ${API_CONTAINER_PORT:-9191}
      DB_URL: ${DB_URL:?set DB_URL}
      DB_USERNAME: ${DB_USERNAME:?set DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      REDIS_HOST: ${REDIS_HOST:?set REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:?set KAFKA_BOOTSTRAP_SERVERS}
      DOUYIN_KAFKA_ENABLED: ${DOUYIN_KAFKA_ENABLED:-true}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      RTC_NODE_ID: ${RTC_NODE_ID:?set RTC_NODE_ID}
      RTC_CALL_RINGING_TTL: ${RTC_CALL_RINGING_TTL:-180s}
      RTC_CALL_HISTORY_RETENTION: ${RTC_CALL_HISTORY_RETENTION:-31d}
      KAFKA_LEDGER_RETENTION_HOURS: ${KAFKA_LEDGER_RETENTION_HOURS:-744}
      KAFKA_OUTBOX_RETENTION_HOURS: ${KAFKA_OUTBOX_RETENTION_HOURS:-744}
      RTC_LIVEKIT_API_KEY: ${RTC_LIVEKIT_API_KEY:-}
      RTC_LIVEKIT_API_SECRET: ${RTC_LIVEKIT_API_SECRET:-}
      RTC_LIVEKIT_WEBHOOK_SECRET: ${RTC_LIVEKIT_WEBHOOK_SECRET:-}
      RTC_TOKEN_TTL_SECONDS: ${RTC_TOKEN_TTL_SECONDS:-300}
      WEBSOCKET_CLUSTER_ENABLED: ${WEBSOCKET_CLUSTER_ENABLED:-true}
      WEBSOCKET_CLUSTER_CHANNEL: ${WEBSOCKET_CLUSTER_CHANNEL:-douyin:websocket:fanout:v1}
      WEBSOCKET_ALLOWED_ORIGINS: ${WEBSOCKET_ALLOWED_ORIGINS:-http://localhost:3000}
      SRS_RTC_PUBLIC_BASE: ${SRS_RTC_PUBLIC_BASE:-}
      SRS_HTTP_PUBLIC_BASE: ${SRS_HTTP_PUBLIC_BASE:-}
      SRS_RTMP_PUBLIC_BASE: ${SRS_RTMP_PUBLIC_BASE:-rtmp://localhost:1935/live/}
      LIVE_MEDIA_RECONCILIATION_ENABLED: ${LIVE_MEDIA_RECONCILIATION_ENABLED:-false}
      SRS_API_BASE: ${SRS_API_BASE:-http://localhost:1985}
      LIVE_MEDIA_AUTH_ENABLED: ${LIVE_MEDIA_AUTH_ENABLED:-false}
      LIVE_MEDIA_TOKEN_SECRET: ${LIVE_MEDIA_TOKEN_SECRET:-}
      SRS_CALLBACK_TOKEN: ${SRS_CALLBACK_TOKEN:-}
      MINIO_ENABLED: ${MINIO_ENABLED:-false}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-smtp.qq.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/$${SERVER_PORT:-9191}'"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s
