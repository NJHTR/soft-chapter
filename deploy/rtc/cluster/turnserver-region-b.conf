# coturn 区域池 region-b(RTC-013)
# 与 region-a 唯一差异:realm、relay 端口范围;宿主机端口 13479/41100-41120 由 compose 映射。
# 本文件不含密钥;TLS 5349 需证书,未验收前保持关闭。
listening-port=3478
# tls-listening-port=5349
min-port=41100
max-port=41120
realm=rtc-b.local
lt-cred-mech
fingerprint
use-auth-secret
no-multicast-peers
log-file=stdout
prometheus