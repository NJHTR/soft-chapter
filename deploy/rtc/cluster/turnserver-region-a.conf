# coturn 区域池 region-a(RTC-013)
# 职责:WebRTC NAT 穿透 relay;REST 临时凭据(use-auth-secret + TURN_SHARED_SECRET 由 compose 注入)
# 本文件不含密钥;TLS 5349 需证书,未验收前保持关闭。
listening-port=3478
# tls-listening-port=5349
min-port=41000
max-port=41020
realm=rtc-a.local
lt-cred-mech
fingerprint
use-auth-secret
no-multicast-peers
log-file=stdout
prometheus