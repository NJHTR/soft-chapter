# RTC-013 共享路由 Redis(节点发现 + room routing 权威存储)
# requirepass 由 compose 从 .env 注入(--requirepass),不写入仓库。
# TLS(6380):需要 PEM 证书链与受信任 CA;未提供证书前保持关闭,不作为验收证据。
port 6379
bind 0.0.0.0
protected-mode yes
appendonly yes
appendfsync everysec
# tls-port 6380
# tls-cert-file /etc/redis/tls/tls.crt
# tls-key-file /etc/redis/tls/tls.key
# tls-ca-cert-file /etc/redis/tls/ca.crt