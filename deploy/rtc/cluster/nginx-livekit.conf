# RTC-013 负载入口模板(LiveKit 节点 A/B 的 HTTP/WS 负载均衡)
# 客户端先任意命中一个节点,LiveKit 通过共享 Redis routing 在 join 响应中返回房间所在节点;
# 因此入口仅需连接级 sticky,不按业务 room 路由(room routing 是 Redis 权威)。
# TLS 终止由上层 LB 完成;本模板不包含证书。
upstream livekit_nodes {
    server livekit-node-a:7880;
    server livekit-node-b:7880;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    location / {
        proxy_pass http://livekit_nodes;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}