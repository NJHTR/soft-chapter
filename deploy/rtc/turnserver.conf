# coturn TURN 边缘配置(RTC-002 bootstrap)
# 职责:WebRTC 的 NAT 穿透 relay,临时凭据(REST API use-auth-secret + TURN_SHARED_SECRET)
# 本文件不含密钥:compose 通过 command 追加 --static-auth-secret=${TURN_SHARED_SECRET}
# TLS 5349 需要 cert/pkey PEM,证书签发归属部署阶段;bootstrap 周期未验证:
#   原因 = 自签证书 + 信任链/Let's Encrypt 均需 DNS 与域名,与 RTC-003 控制面一起落地

listening-port=3478
tls-listening-port=5349
# Avoid the Windows dynamic UDP range that starts at 49152. Compose can
# override these values per environment with TURN_RELAY_MIN/MAX_PORT.
min-port=52000
max-port=52020
realm=rtc.local
lt-cred-mech
fingerprint
use-auth-secret
no-multicast-peers
log-file=stdout
prometheus
