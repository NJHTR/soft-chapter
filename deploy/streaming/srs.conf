# SRS 6 直播媒体服务配置(RTC-002 bootstrap)
# 职责:WHIP/WHEP + RTMP + SRT ingest,HTTP-FLV/HLS 分发
# candidate 必须由环境注入为宿主机可达 IP,否则 WebRTC 协商会拿到容器内网 IP

daemon          off;
srs_log_tank    console;
max_connections 1000;

listen 1935; # RTMP

srt_server {
    enabled on;
    listen 9000;
    maxbw 1000000000;
    latency 120;
    tsbpd on;
}

rtc_server {
    enabled on;
    listen 8000; # WebRTC UDP
    protocol udp;
    # 官方 docker 约定:--env CANDIDATE=宿主机IP;取不到时回退自动探测(容器内网 IP,不可用)
    candidate $CANDIDATE;
}

http_api {
    enabled on;
    listen 1985;
}

http_server {
    enabled on;
    listen 8080;
    dir ./objs/nginx/html;
}

stats {
    network 0;
}

vhost __defaultVhost__ {
    rtc {
        enabled on;
    }
    srt {
        enabled on;
    }
    hls {
        enabled on;
    }
    http_remux {
        enabled on;
        mount [vhost]/[app]/[stream].flv;
    }
}